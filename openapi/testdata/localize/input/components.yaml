components:
  schemas:
    User:
      type: object
      # The last row is deliberately indented further: that is what makes yaml.v3
      # inject a line break into a folded scalar on encode.
      description: >-
        ### User

        | Field | Kind |
        | ----- | ---- |
         | id | string |
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: User ID
        name:
          type: string
          description: User name
        email:
          type: string
          format: email
          description: User email address
        address:
          $ref: "./schemas/address.yaml#/Address"
    Product:
      type: object
      required:
        - id
        - name
        - price
      properties:
        id:
          type: string
          description: Product ID
        name:
          type: string
          description: Product name
        price:
          type: number
          format: float
          description: Product price
        category:
          $ref: "./schemas/category.yaml#/Category"
